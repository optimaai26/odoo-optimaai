[options]
; ════════════════════════════════════════════════════════
;  Odoo configuration
;  Mounted read-only into the container at /etc/odoo/odoo.conf
; ════════════════════════════════════════════════════════

; Master password — required to create / drop / duplicate databases
; via the manager UI at http://localhost:8069/web/database/manager.
; CHANGE THIS in production.
admin_passwd = admin

; Database — these match the env vars in docker-compose.yml. Leave
; db_name empty so Odoo lists all DBs at the login screen; set it
; to a single name for single-tenant deployments.
db_host = odoo-db
db_port = 5432
db_user = odoo
db_password = odoo

; Addons path — the colon-separated list of directories Odoo scans
; for installable modules. /mnt/extra-addons holds your custom
; optimaai module (mounted via docker-compose).
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; XML-RPC — needed by the FastAPI backend's OdooConnector.
; Disabled here = no external API access. Leave both true.
xmlrpc = True
xmlrpc_port = 8069

; Longpolling — for chatter / notification push.
longpolling_port = 8072

; Logging
log_level = info
logfile = False

; Workers — 0 = single-process mode (fine for dev). Bump to 2-4 in
; production for parallel request handling.
workers = 0

; List databases on the login screen. Set to False once you've picked
; a single DB to lock the choice down.
list_db = True

; Proxy mode — flip to True if you sit Odoo behind nginx/Caddy in prod.
proxy_mode = False
